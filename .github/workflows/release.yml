name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.27.0
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Create release PR or publish GitHub release
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          commit-message: "chore: release crack-stack"
          pr-title: "chore: release crack-stack"
          create-github-releases: true
